<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft 1.12.2 Menu + Scene (Web)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="game" aria-label="Игровая сцена"></canvas>

  <div class="crosshair hidden" id="crosshair" aria-hidden="true">+</div>

  <aside id="hud" class="hidden" aria-live="polite">
    <p><strong>Block:</strong> <span id="active-block">Grass</span></p>
    <p>1-0: смена блока • ЛКМ: ломать • ПКМ: ставить • ESC: меню</p>
  </aside>

  <div id="menu-overlay">
    <div class="panorama" aria-hidden="true">
      <div class="layer layer-a"></div>
      <div class="layer layer-b"></div>
      <div class="vignette"></div>
    </div>

    <main class="menu-wrap">
      <header class="brand">
        <h1 class="logo" aria-label="Minecraft">MINECRAFT</h1>
        <p class="edition">Java Edition</p>
        <p class="splash">Now with working buttons!</p>
      </header>

      <section class="menu" aria-label="Главное меню Minecraft 1.12.2">
        <button id="btn-singleplayer" type="button">Singleplayer</button>
        <button id="btn-multiplayer" type="button">Multiplayer</button>
        <button id="btn-realms" type="button">Minecraft Realms</button>

        <div class="menu-row">
          <button id="btn-options" type="button">Options...</button>
          <button id="btn-quit" type="button">Quit Game</button>
        </div>
      </section>

      <section id="options-panel" class="options hidden" aria-label="Options panel">
        <label>
          Mouse sensitivity
          <input id="sensitivity" type="range" min="0.2" max="2" value="1" step="0.1" />
        </label>
        <button id="btn-close-options" type="button">Done</button>
      </section>
    </main>

    <footer class="footer">
      <p>Minecraft 1.12.2 (web-inspired)</p>
      <p>Prototype for demo purposes</p>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
