<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Style Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1>METAcraft</h1>
      <p>Почти как Minecraft: блоки, пиксели и дух выживания.</p>
    </header>

    <main class="panel" aria-label="Главная панель">
      <h2>Добро пожаловать в мир блоков</h2>
      <p class="subtitle">
        Добывай ресурсы, строй базу и исследуй пиксельный мир.
      </p>

      <ul class="features">
        <li>⛏️ Добыча руды</li>
        <li>🧱 Строительство из блоков</li>
        <li>🌙 Выживание ночью</li>
      </ul>

      <button id="actionBtn" type="button">Начать выживание</button>
      <p id="message" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
