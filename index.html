<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>METAcraft Launcher Mock</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="launcher">
      <aside class="sidebar glass-panel">
        <div class="profile">
          <div class="avatar">S</div>
          <div>
            <p class="name">Steve</p>
            <p class="status-online">● Connected</p>
          </div>
        </div>

        <nav class="left-nav">
          <a href="#" class="left-item">News</a>
          <a href="#" class="left-item active">Minecraft Java Edition</a>
          <a href="#" class="left-item">Settings</a>
        </nav>
      </aside>

      <section class="main">
        <header class="topbar glass-panel">
          <p class="edition">MINECRAFT: JAVA EDITION</p>
          <nav class="tabs">
            <a href="#" class="tab active">Play</a>
            <a href="#" class="tab">Installations</a>
            <a href="#" class="tab">Skins</a>
            <a href="#" class="tab">Patch notes</a>
          </nav>
        </header>

        <div class="hero">
          <div class="hero-logo">MINECRAFT<br /><span>JAVA EDITION</span></div>
        </div>

        <footer class="bottom glass-panel">
          <div class="release">
            <p class="release-title">Latest release</p>
            <p class="release-version">1.14.4</p>
          </div>

          <div class="cta-group">
            <button id="playBtn" class="play-btn" type="button">PLAY</button>
            <button id="downloadBtn" class="download-btn" type="button">СКАЧАТЬ</button>
          </div>

          <p id="player" class="player">Steve</p>
        </footer>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
